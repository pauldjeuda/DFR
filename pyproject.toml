[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "dfr"
version = "0.1.0"
description = "Distributed File Replicator for Debian nodes"
requires-python = ">=3.11"
dependencies = ["Flask>=2.2", "gunicorn>=20"]

[project.optional-dependencies]
test = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
dfrd = "dfr.service:main"
dfr-ctl = "dfr.cli:main"
dfr-web = "dfr.webserver:main"

[tool.setuptools.packages.find]
include = ["dfr*"]

[tool.setuptools.package-data]
dfr = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E9", "F", "I"]
