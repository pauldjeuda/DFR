# DFR Configuration File

# Directory to watch and replicate
watch_dir=/var/dfr/sync

# Unique identifier for this node (leave empty to use hostname)
node_id=

# Network port for inter-node communication
network_port=9876

# Control interface port
control_port=9877

# Debug mode (yes/no)
debug_mode=no

# Peer nodes (format: ip:port)
# Add one peer line for each remote node
# Example:
# peer=192.168.1.100:9876
# peer=192.168.1.101:9876